<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"/>

  <style>
    body {
      min-height: 100vh;
      background: #f6f7fb;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .todo-card {
      width: 100%;
      max-width: 520px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .todo-title {
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .todo-list .list-group-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .todo-text {
      word-break: break-word;
      margin: 0;
      flex: 1;
    }
    .hint {
      font-size: 0.9rem;
      color: #6c757d;
    }
  </style>
</head>

<body>
  <div class="card todo-card">
    <div class="card-body p-4 p-md-5">
      <h2 class="text-center todo-title mb-4">Todo App</h2>

      <form id="todoForm" class="mb-3">
        <div class="input-group">
          <input
            id="todoInput"
            type="text"
            class="form-control"
            placeholder="Enter a todo"
            aria-label="Enter a todo"
          />
          <button class="btn btn-primary" type="submit">Add</button>
        </div>
        <div class="d-flex justify-content-between mt-2">
          <small class="hint">Press Enter to add</small>
          <small id="msg" class="hint"></small>
        </div>
      </form>

      <ul id="todoList" class="list-group todo-list"></ul>
    </div>
  </div>

  <script>
    const todoForm = document.getElementById("todoForm");
    const todoInput = document.getElementById("todoInput");
    const todoList = document.getElementById("todoList");
    const msg = document.getElementById("msg");

    function showMsg(text) {
      msg.textContent = text;
      if (!text) return;
      setTimeout(() => (msg.textContent = ""), 1500);
    }

    function addTodo(todoText) {
      // Create list item dynamically using createElement()
      const li = document.createElement("li");
      li.className = "list-group-item";

      const p = document.createElement("p");
      p.className = "todo-text";
      p.textContent = todoText;

      const delBtn = document.createElement("button");
      delBtn.className = "btn btn-danger btn-sm";
      delBtn.type = "button";
      delBtn.textContent = "Delete";

      // Remove todo using remove()
      delBtn.addEventListener("click", () => {
        li.remove();
        showMsg("Todo deleted");
      });

      li.appendChild(p);
      li.appendChild(delBtn);
      todoList.appendChild(li);
    }

    todoForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const text = todoInput.value.trim();
      if (!text) {
        showMsg("Please enter a todo");
        todoInput.focus();
        return;
      }

      addTodo(text);
      todoInput.value = "";
      todoInput.focus();
      showMsg("Todo added");
    });

    // Optional: add a few sample todos (remove if you don't want)
    // ["todo 1", "todo 2", "todo 3"].forEach(addTodo);
  </script>
</body>
</html>
