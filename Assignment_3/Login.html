 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body { background:#f5f6f8; }
    .card-box{
      max-width: 520px;
      margin: 80px auto;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.08);
    }
    .btn-wide{ width: 100%; }
  </style>
</head>
<body>
  <div class="card card-box p-4">
    <h2 class="text-center fw-semibold mb-4">Login</h2>

    <form id="loginForm" novalidate>
      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input id="loginEmail" type="email" class="form-control" placeholder="Enter email" required>
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="loginPassword" type="password" class="form-control" placeholder="Password" required>
        <div class="invalid-feedback">Password must be at least 6 characters long.</div>
      </div>

      <button class="btn btn-primary btn-lg btn-wide" type="submit">Login</button>

      <div class="text-center mt-3">
        <a href="register.html">Create account</a>
      </div>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const emailEl = document.getElementById("loginEmail");
    const passEl  = document.getElementById("loginPassword");

    function validateLogin() {
      let ok = true;

      // email: required + browser email validity
      if (!emailEl.value.trim() || !emailEl.checkValidity()) {
        emailEl.classList.add("is-invalid");
        emailEl.classList.remove("is-valid");
        ok = false;
      } else {
        emailEl.classList.remove("is-invalid");
        emailEl.classList.add("is-valid");
      }

      // password: required + min 6
      if (!passEl.value.trim() || passEl.value.trim().length < 6) {
        passEl.classList.add("is-invalid");
        passEl.classList.remove("is-valid");
        ok = false;
      } else {
        passEl.classList.remove("is-invalid");
        passEl.classList.add("is-valid");
      }

      return ok;
    }

    // realtime UX
    emailEl.addEventListener("input", validateLogin);
    passEl.addEventListener("input", validateLogin);

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (validateLogin()) {
        alert("Login Successful");
        loginForm.reset();
        emailEl.classList.remove("is-valid");
        passEl.classList.remove("is-valid");
      }
    });
  </script>
</body>
</html>
